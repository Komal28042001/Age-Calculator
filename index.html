<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Calculator</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=swap" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-bar">
        <button id="themeToggle" class="theme-btn">🌙</button>
    </header>

    <main class="layout">
        <!-- LEFT PANEL -->
        <section class="left-panel">
            <div class="input-row">
                <div class="field">
                    <label>DAY</label>
                    <input type="number" id="day" placeholder="DD">
                </div>

                <div class="field">
                    <label>MONTH</label>
                    <input type="number" id="month" placeholder="MM">
                </div>

                <div class="field">
                    <label>YEAR</label>
                    <input type="number" id="year" placeholder="YYYY">
                </div>
            </div>

            <div class="divider">
                <button id="calcBtn" class="circle-btn">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                        <path d="M12 5v14m0 0l-6-6m6 6l6-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </section>

        <!-- RIGHT PANEL -->
        <section class="right-panel">
            <p><span id="years" class="highlight">--</span> years</p>
            <p><span id="months" class="highlight">--</span> months</p>
            <p><span id="days" class="highlight">--</span> days</p>
        </section>
    </main>

    <!-- External JS -->
    <script src="script.js"></script>
</body>
</html>
